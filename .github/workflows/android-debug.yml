name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'tools/prepare-native.mjs'
      - 'tools/patch-health-manifest.mjs'
      - 'health-connect.js'
      - 'privacypolicy.html'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: progressa-android-debug-keystore-v1

      - name: Create Android debug signing key if missing
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Progressa Debug,O=Progressa,C=BR"
          fi

      - name: Show Android signing SHA-1
        shell: bash
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA-1:" || true

      - name: Prepare web bundle
        run: npm run native:web

      - name: Add Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version from package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const match = /^(\\d+)\\.(\\d+)\\.(\\d+)$/.exec(pkg.version);
          if (!match) throw new Error(`Unsupported app version: ${pkg.version}`);
          const versionCode = Number(match[1]) * 10000 + Number(match[2]) * 100 + Number(match[3]);
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const codePattern = /^(\\s*versionCode\\s+)\\d+/m;
          const namePattern = /^(\\s*versionName\\s+)['"][^'"]*['"]/m;
          if (!codePattern.test(gradle) || !namePattern.test(gradle)) {
            throw new Error('Could not find Android versionCode/versionName in app/build.gradle');
          }
          gradle = gradle.replace(codePattern, (_, prefix) => `${prefix}${versionCode}`);
          gradle = gradle.replace(namePattern, (_, prefix) => `${prefix}"${pkg.version}"`);
          fs.writeFileSync(gradlePath, gradle);
          console.log(`Android APK version: ${pkg.version} (${versionCode})`);
          NODE

      - name: Generate Progressa native icon
        run: |
          mkdir -p resources
          cp progressa-icon-v640-maskable-512.png resources/icon.png
          npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#070709' --iconBackgroundColorDark '#070709' --splashBackgroundColor '#070709' --splashBackgroundColorDark '#070709'

      - name: Patch Health Connect manifest
        run: node tools/patch-health-manifest.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: progressa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
