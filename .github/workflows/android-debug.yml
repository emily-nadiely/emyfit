name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'tools/prepare-native.mjs'
      - 'tools/patch-health-manifest.mjs'
      - 'health-connect.js'
      - 'privacypolicy.html'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: npm run native:web

      - name: Add Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Health Connect manifest
        run: node tools/patch-health-manifest.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: progressa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
