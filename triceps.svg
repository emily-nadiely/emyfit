<style>
.bg{fill:#141719}.floor{stroke:#343a3d;stroke-width:4}.machine{fill:none;stroke:#8e9a9e;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.body{fill:none;stroke:#f0d2bd;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#f0d2bd}.accent{fill:none;stroke:#d9a574;stroke-width:7;stroke-linecap:round;stroke-dasharray:12 10}.label{fill:#b7c0c3;font:600 19px system-ui}.plate{fill:#4c5559;stroke:#9ba6aa;stroke-width:3}.pad{fill:#353c3f}.motion{transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 1.6s infinite ease-in-out}@keyframes pulse{50%{opacity:.35}}</style>
