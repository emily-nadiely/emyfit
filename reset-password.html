<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Progressa — Nova senha</title>
<link rel="icon" href="./progressa-icon-v640-512.png">
<style>
:root{color-scheme:dark;--bg:#08080b;--card:#111116;--line:#2a2a32;--text:#f7f7f8;--muted:#aaaab3;--red:#ff1744}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#3b0711 0,#08080b 45%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);background:rgba(17,17,22,.96);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 60px #0008}
.logo{width:72px;height:72px;border-radius:20px;display:block;margin-bottom:18px}h1{font-size:32px;line-height:1.1;margin:0 0 10px}.muted{color:var(--muted);line-height:1.5}.field{margin-top:18px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;background:#0d0d12;border:1px solid #35353f;border-radius:16px;color:white;padding:16px;font-size:17px;outline:none}input:focus{border-color:#ff3657}
button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;color:white;background:linear-gradient(135deg,#ff2049,#e9002d);cursor:pointer}
button:disabled{opacity:.55}.msg{margin-top:16px;padding:14px;border-radius:14px;background:#1b1114;border:1px solid #6c2431;line-height:1.45}.ok{background:#101a13;border-color:#275f36}.hidden{display:none}
.small{font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="./progressa-icon-v640-512.png" alt="Progressa">
<h1>Criar nova senha</h1>
<p class="muted">Defina uma nova senha para sua conta Progressa. Depois, volte ao aplicativo e entre normalmente com seu e-mail.</p>
<div id="formWrap">
  <div class="field"><label for="p1">Nova senha</label><input id="p1" type="password" minlength="8" autocomplete="new-password" placeholder="mínimo de 8 caracteres"></div>
  <div class="field"><label for="p2">Confirmar nova senha</label><input id="p2" type="password" minlength="8" autocomplete="new-password" placeholder="repita a senha"></div>
  <button id="saveBtn" onclick="savePassword()">Salvar nova senha</button>
</div>
<div id="msg" class="msg hidden"></div>
<p class="muted small">Se o link expirou, volte ao Progressa e solicite um novo em “Esqueci minha senha”.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const cfg=window.EMYFIT_CONFIG||{};
const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
const msg=document.getElementById('msg');
function show(text,ok=false){msg.textContent=text;msg.className='msg'+(ok?' ok':'')}
async function ensureRecoverySession(){
  try{
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(data?.session)return true;
  }catch(e){}
  return new Promise(resolve=>{
    const timeout=setTimeout(()=>resolve(false),3500);
    const {data}=client.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY'||session){
        clearTimeout(timeout);data.subscription.unsubscribe();resolve(true);
      }
    });
  });
}
async function savePassword(){
  const btn=document.getElementById('saveBtn'),p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<8)return show('Use uma senha com pelo menos 8 caracteres.');
  if(p1!==p2)return show('As senhas não conferem.');
  btn.disabled=true;btn.textContent='Salvando…';
  try{
    const ready=await ensureRecoverySession();
    if(!ready)throw new Error('Link inválido ou expirado.');
    const {error}=await client.auth.updateUser({password:p1});
    if(error)throw error;
    show('Senha alterada com sucesso. Agora volte ao aplicativo Progressa e entre com seu e-mail e a nova senha.',true);
    document.getElementById('formWrap').classList.add('hidden');
  }catch(e){
    show(e?.message||'Não foi possível alterar a senha. Solicite um novo link pelo aplicativo.');
  }finally{
    btn.disabled=false;btn.textContent='Salvar nova senha';
  }
}
</script>
</body>
</html>
